name: CI

# Nothing ran on the first pull request, so this runs on every one after it.
#
# Branch protection is not available here: the organisation is on the free plan and
# the repository is private, and the protection API answers 403. So a red check
# blocks nothing by itself. It is a signal for the reviewer rather than a gate, and
# saying that is better than implying a rule that does not exist.
on:
  pull_request:
  push:
    branches: [main]

# A second push to a branch cancels the first run. Nothing here writes anywhere, so
# an interrupted run costs nothing but the minutes it gives back.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      # Pinned to a commit rather than a tag. A tag is mutable, this repository is
      # going public, and a moved tag would run code nobody here reviewed. The
      # version is in the comment so the pin can be read and updated by a person.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          # Matches the Vercel build runtime the demo url will run on, so a green
          # check is a signal about the deploy build rather than about a different
          # major. @types/node stays at 22 for now and moves together with an
          # engines field once this repository actually has a Vercel project.
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Types
        run: npm run check-types

      # No secrets and no network. The payment checks refuse at readConfig, before a
      # facilitator is contacted, which is why this runs on a pull request from a
      # fork with nothing configured.
      - name: Checks
        run: npm test

      # There is no lint step, and the lint script is gone with it. `next lint` is
      # deprecated, is removed in Next 16, and prompts interactively to scaffold a
      # config when none exists, which in a runner is a job that hangs rather than a
      # job that fails. Migrating to the ESLint CLI was tried and abandoned in the
      # same sitting: eslint-config-next pulls @rushstack/eslint-patch, which throws
      # "Failed to patch ESLint because the calling module was not recognized" on
      # ESLint 9. Adding that dependency tree to a repository about to go public,
      # days before it is judged, buys less than tsc already gives.
